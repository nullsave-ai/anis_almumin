name: Build Flutter APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Base Project and Build
        run: |
          WORKSPACE_DIR=$PWD
          flutter create --org app --project-name anis_almumin --platforms android ../base
          cp -r android lib assets pubspec.yaml ../base/
          
          # Add native datastore and coroutines dependencies for Kotlin
          if [ -f ../base/android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("androidx.datastore:datastore-preferences:1.1.7")\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")\n}\n' >> ../base/android/app/build.gradle.kts
          else
            printf '\ndependencies {\n    implementation "androidx.datastore:datastore-preferences:1.1.7"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"\n}\n' >> ../base/android/app/build.gradle
          fi

          cd ../base
          flutter pub get
          # Build split-per-abi for small size (~18MB) and universal APK
          flutter build apk --release --split-per-abi
          flutter build apk --release

          mkdir -p "$WORKSPACE_DIR/dist"
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk "$WORKSPACE_DIR/dist/anis_almumin-arm64.apk"
          cp app-armeabi-v7a-release.apk "$WORKSPACE_DIR/dist/anis_almumin-arm32.apk"
          cp app-release.apk "$WORKSPACE_DIR/dist/anis_almumin-universal.apk"
          ls -lh "$WORKSPACE_DIR/dist/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anis_almumin_apks
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Anis Al Mumin v1.0.${{ github.run_number }} (Optimized)"
          body: |
            ### تطبيق أنيس المؤمن (Flutter + Kotlin):
            * **`anis_almumin-arm64.apk`** (~18MB): **النسخة الموصى بها لهاتفك (Tecno Camon 30) وللهواتف الحديثة (64-bit)**.
            * **`anis_almumin-arm32.apk`** (~16MB): للأجهزة القديمة (32-bit).
            * **`anis_almumin-universal.apk`** (~51MB): النسخة الشاملة لجميع الأجهزة.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
